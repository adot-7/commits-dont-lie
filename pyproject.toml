[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "commits-dont-lie"
version = "0.2.0"
description = "Drafts build-in-public posts from your commits and blocks every sentence the diff can't back up. Model calls run on BharatCode."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anthropic>=1.5,<2",
    "slack_sdk>=3.33,<4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
cdl = "cdl.__main__:main"

[project.urls]
Repository = "https://github.com/adot-7/commits-dont-lie"

[tool.setuptools.packages.find]
include = ["cdl*"]

[tool.setuptools.package-data]
cdl = ["templates/*.html", "static/*"]
